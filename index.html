<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiado</title>
<meta name="description" content="Anote quem te deve, conte as sextas furadas e mande a cobrança pronta.">
<meta name="theme-color" content="#F2F0FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
/* Layout: one phone-width column — lime "te devem" card, then the list of who swore they'd pay; each person opens in a bottom sheet. */
:root{
  --bg:#F2F0FA; --bg-glow:#E6E1F7; --surface:#FFFFFF; --surface-2:#F7F6FC;
  --ink:#16141F; --muted:#6B6680; --line:#E3DFEF; --edge:transparent;
  --lime:#C9F03A; --lime-ink:#1B2400; --lime-soft:color-mix(in srgb,var(--lime) 32%,var(--surface));
  --brand:var(--lime); --brand-ink:var(--lime-ink); --btn:var(--ink); --btn-ink:var(--bg);
  --pay:#FF9B85; --pay-ink:#2A1A12;
  --late:#E5484D; --late-soft:#FDE8E8; --soon:#B86E00; --soon-soft:#FFF1D6; --ok:#2F7D32;
  --shadow:0 1px 2px rgba(30,20,60,.06),0 8px 24px rgba(30,20,60,.06);
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-accent:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0A0F; --bg-glow:#0B0A0F; --surface:#18161F; --surface-2:#211F2B;
  --ink:#FFFFFF; --muted:#BDB8D0; --line:#2E2B3A; --edge:rgba(255,255,255,.07);
  --late:#FF6B6F; --late-soft:#3A1C20; --soon:#F0B04A; --soon-soft:#3A2C12; --ok:#7DD87F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0A0F; --bg-glow:#0B0A0F; --surface:#18161F; --surface-2:#211F2B;
  --ink:#FFFFFF; --muted:#BDB8D0; --line:#2E2B3A; --edge:rgba(255,255,255,.07);
  --late:#FF6B6F; --late-soft:#3A1C20; --soon:#F0B04A; --soon-soft:#3A2C12; --ok:#7DD87F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
/* the app's own Ajustes > Tema wins over the system/viewer theme */
html:root[data-mode="light"]{
  --bg:#F2F0FA; --bg-glow:#E6E1F7; --surface:#FFFFFF; --surface-2:#F7F6FC;
  --ink:#16141F; --muted:#6B6680; --line:#E3DFEF; --edge:transparent;
  --late:#E5484D; --late-soft:#FDE8E8; --soon:#B86E00; --soon-soft:#FFF1D6; --ok:#2F7D32;
  --shadow:0 1px 2px rgba(30,20,60,.06),0 8px 24px rgba(30,20,60,.06); color-scheme:light}
html:root[data-mode="dark"]{
  --bg:#0B0A0F; --bg-glow:#0B0A0F; --surface:#18161F; --surface-2:#211F2B;
  --ink:#FFFFFF; --muted:#BDB8D0; --line:#2E2B3A; --edge:rgba(255,255,255,.07);
  --late:#FF6B6F; --late-soft:#3A1C20; --soon:#F0B04A; --soon-soft:#3A2C12; --ok:#7DD87F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(60rem 30rem at 85% -10%,var(--bg-glow),transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 200px;display:flex;flex-direction:column;gap:22px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
em.acc{font-family:var(--f-accent);font-style:italic;font-weight:400;letter-spacing:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:18px;line-height:1;overflow:hidden}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.icon-btn:hover{color:var(--ink)}

/* hero */
.hero{position:relative;background:var(--lime);color:var(--lime-ink);border-radius:24px;padding:22px 22px 20px;overflow:hidden;min-height:168px}
.hero .lbl{font-size:14px;font-weight:500;opacity:.75}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,11vw,58px);letter-spacing:-.035em;line-height:1;margin-top:4px}
.hero .big small{font-size:.5em;letter-spacing:-.01em;margin-right:4px}
.hero .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.hero .chip{background:color-mix(in srgb,currentColor 12%,transparent);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.mascot{position:absolute;right:-6px;bottom:-10px;width:118px;height:118px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.mascot{animation:bob 3.2s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}

/* section heading */
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sec-h h2 em.acc{font-size:1.12em}
.sec-h .count{color:var(--muted);font-size:13px}

/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--lime-soft);color:var(--ink)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.ex-tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:20px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font-family:var(--f-display);font-size:19px;color:var(--ink)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted)}
.link-btn{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
details.paid summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:500;list-style:none;padding:4px 2px}
details.paid summary::-webkit-details-marker{display:none}
details.paid[open] summary{margin-bottom:10px}
.note{font-size:12.5px;color:var(--muted);text-align:center}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);white-space:nowrap;border:0;border-radius:999px;padding:15px 24px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(20,10,40,.25);z-index:20}
.fab .plus{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:800}

/* sheet */
html.locked,html.locked body{overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(10,6,24,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet > *{flex-shrink:0}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-top:1px solid var(--edge);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:88%}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h3{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0}
.sheet-h{position:sticky;top:-10px;z-index:3;background:var(--bg);padding-block:8px;margin-block:-8px}
.x{border:0;background:var(--ink);color:var(--bg);width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* list surfaces get a hairline edge in dark mode */
.list,.owe,.tl,.cfg-sec,.box{border:1px solid var(--edge)}

/* bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.nav .ic{display:grid;place-items:center;width:48px;height:30px;border-radius:999px;transition:background .15s}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}

/* module screens */
.stack{display:flex;flex-direction:column;gap:12px}
.hero.mod{background:var(--modc);color:#1A1424;cursor:default}
.hero.mod:active{transform:none}
.mod-ic{position:absolute;right:-8px;bottom:-14px;opacity:.22;pointer-events:none}
.neg{color:var(--late)} .pos{color:var(--ok)}
.av.sq{border-radius:13px}
.ov .ov-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.ov .ov-row:first-child{border-top:0}
.ov .ov-row span{color:var(--muted)}
.ov .ov-row.tot span{color:var(--ink);font-weight:600}
.ov .ov-row.tot b{font-family:var(--f-display);font-weight:800;font-size:19px}
.hint{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.money.sm span{font-size:17px}.money.sm input{font-size:22px;padding:4px 6px}
.btn.shp{background:#FFAA70;color:#2A1408}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--ink)}
.stepper output{min-width:2.4ch;text-align:center;font-weight:800;font-family:var(--f-display);font-size:22px}
.btn.danger.armed{background:var(--late);color:#fff}

/* credit cards */
.cards{display:flex;flex-direction:column;gap:12px}
.cc{border:0;width:100%;text-align:left;border-radius:20px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc),#000 38%));display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);font:inherit}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px}
.cc-pill{font-family:var(--f-body);font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 9px}
.cc-sub{font-size:12.5px;opacity:.85}
.cc-fat{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.cc-warn{font-size:12.5px;font-weight:600;background:rgba(0,0,0,.22);border-radius:10px;padding:6px 10px}
.cc-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.cc-bar i{display:block;height:100%;background:#fff;border-radius:6px}
.cc-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;opacity:.9}

/* several people in one entry */
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tokens:empty{display:none}
.tok{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 6px 6px 12px;font-weight:600;font-size:14px}
.tok b{width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--bg) 22%,transparent);display:grid;place-items:center;font-size:14px;line-height:1}

/* "Me devem" / "Eu devo" switch */
.lado{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px}
.lado button{border:0;background:none;border-radius:13px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.lado button span{font-family:var(--f-display);font-weight:700;font-size:15px}
.lado button small{font-size:12px;font-weight:600}
.lado button[data-lado="receber"][aria-selected="true"]{background:var(--lime);color:var(--lime-ink)}
.lado button[data-lado="pagar"][aria-selected="true"]{background:var(--pay);color:var(--pay-ink)}
.hero.pay{background:var(--pay);color:var(--pay-ink)}
.btn.pay{background:var(--pay);color:var(--pay-ink)}
.fab.pay .plus{background:var(--pay);color:var(--pay-ink)}

/* hero opens the summary */
.hero{cursor:pointer;-webkit-user-select:none;user-select:none}
.hero:active{transform:scale(.99)}
.hero .more{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;margin-top:12px;border-bottom:1.5px solid currentColor;padding-bottom:1px}

/* main tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* summary sheet */
.box{background:var(--surface);border-radius:18px;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.late .v{color:var(--late)}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
  .kpi{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:0;border-top:1px solid var(--line);padding:11px 14px}
  .kpi:first-child{border-top:0}
  .kpi .k{font-size:13.5px}
}
details.day{border-top:1px solid var(--line)}
details.day:first-child{border-top:0}
details.day summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:13px 14px}
details.day summary::-webkit-details-marker{display:none}
details.day summary .d{font-weight:600}
details.day summary .s{font-size:12.5px;color:var(--muted)}
details.day summary .v{font-family:var(--f-display);font-weight:800;font-size:17px}
details.day summary .chev{color:var(--muted);transition:transform .15s}
details.day[open] summary .chev{transform:rotate(90deg)}
details.day[open] summary{background:var(--surface-2)}
.who{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px dashed var(--line)}
.who .av{width:32px;height:32px;font-size:14px}
.who .n{font-weight:600;font-size:14px}
.who .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .v{font-weight:700;font-family:var(--f-display)}
.open-p{border:0;background:none;color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:10px 14px 14px;text-align:left}

/* chart */
.chart-card{background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.donut-wrap{position:relative;width:min(100%,260px);aspect-ratio:1;margin:0 auto}
.donut-wrap svg{width:100%;height:100%;display:block}
.donut-wrap path{cursor:pointer;transition:opacity .15s}
.donut-wrap.has-sel path:not(.sel){opacity:.3}
.donut-c{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-c .k{font-size:12.5px;color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-c .v{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6.5vw,28px);letter-spacing:-.02em;line-height:1.1}
.donut-c .p{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:10px;align-items:center;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.lg:first-child{border-top:0}
.lg i{width:12px;height:12px;border-radius:4px}
.lg .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .v{font-weight:700;font-family:var(--f-display)}
.lg .p{color:var(--muted);font-size:13px;text-align:right}
.lg[aria-pressed="true"]{background:var(--surface-2);border-radius:10px}

/* update banner */
.upd{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:500}
.upd button{border:0;background:var(--lime);color:var(--lime-ink);border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--ink);outline-offset:-1px}
.money{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.money:focus-within{outline:2px solid var(--ink);outline-offset:-1px}
.money span{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted)}
.money input{border:0;background:none;font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;padding:6px 8px;width:100%;min-width:0;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pchips{display:flex;gap:8px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding-inline:18px}
.pchips::-webkit-scrollbar{display:none}
.pchip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:7px 12px 7px 7px;text-align:left;color:var(--ink)}
.pchip .av{width:32px;height:32px;font-size:14px}
.pchip .t{display:flex;flex-direction:column;line-height:1.2}
.pchip .n{font-weight:600;font-size:14px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.pchip small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pchip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);box-shadow:0 0 0 1.5px var(--ink)}
.pchip.novo{border-style:dashed}
.pchip .plus-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:18px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--btn);color:var(--btn-ink)}

/* Ajustes */
.cfg-sec{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:18px;padding:16px}
.cfg-sec h4{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{border:2px solid transparent;background:none;padding:2px;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.sw i{display:block;width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.sw[aria-pressed="true"] i{outline:2px solid var(--ink);outline-offset:2px}
.color-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.color-row:first-of-type{border-top:0;padding-top:0}
.color-row .t{font-weight:500}
.color-row .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.color-row input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px;cursor:pointer}
.reset{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding-block:12px 4px;display:grid;grid-template-columns:1fr 2fr;gap:8px;z-index:2}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions .btn{flex-direction:column;gap:2px;padding:12px 6px;font-size:13px}
.actions .btn b{font-size:18px;line-height:1}
.err{color:var(--late);font-size:13px;min-height:1em}

.p-head{display:flex;gap:14px;align-items:center}
.p-head .av{width:56px;height:56px;font-size:22px}
.p-head .nm{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.owe{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.owe .lbl{font-size:13px;color:var(--muted)}
.owe .v{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.03em;line-height:1.05}
.sextas{text-align:right}
.sextas .n{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.sextas .t{font-size:12px;color:var(--muted)}

.tl{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden}
.tl-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.tl-item:first-child{border-top:0}
.tl-item .d{font-weight:500;overflow-wrap:anywhere}
.tl-item .s{font-size:12.5px;color:var(--muted)}
.tl-item .v{font-weight:700;font-family:var(--f-display)}
.tl-item .v.in{color:var(--ok)}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:6px}
.del.armed{color:var(--late);font-weight:600}
.msg{min-height:190px;resize:vertical;line-height:1.5}
.tiny{font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--lime);color:var(--lime-ink);font-weight:700;border-radius:999px;padding:10px 18px;z-index:60;box-shadow:var(--shadow);font-family:var(--f-display);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.bad{background:var(--late);color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlShort = c => (c/100).toLocaleString('pt-BR',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const nextFriday = () => { const d = new Date(); const k = (5 - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate()+k); return iso(d); };
const endOfMonth = () => { const d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth()+1, 0)); };
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const fmtDate = s => { const d = parse(s); return WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const fmtShort = s => { const d = parse(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// "1.250,40" / "1250,4" / "5.000" (dot = thousands) / "12.50" (dot = decimal) -> cents
const toCents = v => {
  v = String(v).trim().replace(/\s|R\$/g,''); if(!v) return 0;
  if(v.includes(',')) v = v.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,'');
  const n = Number(v); return isFinite(n) ? Math.round(n*100) : NaN;
};
function fridaysSince(start){ // Fridays after `start` up to today
  let n = 0, d = parse(start), end = parse(today()); d.setDate(d.getDate()+1);
  for(let i=0; d<=end && i<4000; i++){ if(d.getDay()===5) n++; d.setDate(d.getDate()+1); }
  return n;
}
const AV = ['#F2762E','#E5484D','#8E4EC6','#2E8BC0','#12A594','#D6409F','#E5A000','#5B5BD6'];
const avColor = name => { let h=0; for(const ch of String(name)) h = (h*31 + ch.charCodeAt(0))>>>0; return AV[h % AV.length]; };
const initial = name => (String(name).trim()[0] || '?').toUpperCase();
const avatar = p => `<div class="av" style="background:${avColor(p.nome)}" aria-hidden="true">${esc(initial(p.nome))}</div>`;

/* ---------- store ---------- */
// every collection the app keeps (all in one localStorage document)
const KINDS = ['pessoas','lanc','contas','cartoes','compras','faturasPagas','shopee','perfumes','vendas'];
const S = { config:{}, mode:'loading', slow:false, readOnly:false };
KINDS.forEach(k=>S[k]={});
let db = null;
const LS = 'fiado-v1';
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(LS)||'{}'); KINDS.forEach(k=>S[k]=j[k]||{}); S.config=j.config||{}; }catch(e){} }
function saveLocal(){ try{ const o = {config:S.config}; KINDS.forEach(k=>o[k]=S[k]); localStorage.setItem(LS, JSON.stringify(o)); }catch(e){ toast('Não deu pra salvar no aparelho.', true); } }
const COLL = { pessoas:'pessoas', lanc:'lancamentos' };

async function put(kind, id, data){
  if(kind==='config'){ S.config = data; } else { S[kind][id] = data; }
  render();
  if(db){
    try{ await (kind==='config' ? db.doc('config/geral') : db.collection(COLL[kind]).doc(id)).set(data); }
    catch(e){ toast(e && e.code==='quota_exceeded' ? 'Limite de registros atingido. Apague alguns antigos.' : 'Não deu pra salvar. Tente de novo.', true); if(e && e.code==='invalid_argument'){ S.readOnly = true; render(); } }
  } else saveLocal();
}
async function del(kind, id){
  delete S[kind][id]; render();
  if(db){ try{ await db.collection(COLL[kind]).doc(id).delete(); }catch(e){ toast('Não deu pra apagar. Tente de novo.', true); } }
  else saveLocal();
}

async function boot(){
  render();
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){ loadLocal(); S.mode = 'local'; render(); return; }
  S.mode = 'loading';
  const pending = new Set(['p','l','c']);
  const timer = setTimeout(()=>{ if(pending.size){ S.slow = true; render(); } }, 10000);
  const done = (k, snap) => { if(!snap.metadata.fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); S.slow=false; } } if(S.mode==='loading') S.mode='db'; render(); };
  const fail = k => () => { pending.delete(k); S.mode='db'; S.slow=true; render(); };
  db.collection('pessoas').onSnapshot(s => { S.pessoas = Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); done('p',s); }, fail('p'));
  db.collection('lancamentos').onSnapshot(s => { S.lanc = Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); done('l',s); }, fail('l'));
  db.doc('config/geral').onSnapshot(s => { S.config = s.exists ? s.data() : {}; done('c',s); }, fail('c'));
}

/* ---------- derived ---------- */
// Each entry belongs to one side: 'receber' (they owe you; the default for old data) or 'pagar' (you owe them).
const ladoDe = l => l.dir==='pagar' ? 'pagar' : 'receber';
const PAGAR = () => ui.lado==='pagar';
function summary(pid, lado){
  lado = lado || ui.lado;
  const items = Object.entries(S.lanc).filter(([,l])=>l.pessoaId===pid && ladoDe(l)===lado).map(([id,l])=>({id,...l}));
  const dividas = items.filter(l=>l.tipo==='divida').sort((a,b)=>a.data.localeCompare(b.data) || (a.criadoEm||0)-(b.criadoEm||0));
  let pago = items.filter(l=>l.tipo==='pagamento').reduce((s,l)=>s+l.valor,0);
  const total = dividas.reduce((s,l)=>s+l.valor,0);
  const saldo = Math.max(0, total - pago);
  // FIFO: payments clear the oldest debts first
  const abertas = [];
  for(const d of dividas){ const use = Math.min(pago, d.valor); pago -= use; if(d.valor-use>0) abertas.push({...d, resta:d.valor-use}); }
  const oldest = abertas[0];
  const promessas = abertas.map(a=>a.prometido).filter(Boolean).sort();
  const prazo = promessas[0] || null;
  let status = {cls:'none', txt:'sem prazo'};
  if(saldo<=0) status = {cls:'ok', txt:'quitado'};
  else if(prazo){
    const dd = daysBetween(today(), prazo);
    if(dd<0) status = {cls:'late', txt: -dd===1 ? 'atrasado 1 dia' : `atrasado ${-dd} dias`};
    else if(dd===0) status = {cls:'soon', txt:'vence hoje'};
    else if(dd<=3) status = {cls:'soon', txt:'paga '+fmtDate(prazo).split(',')[0]};
    else status = {cls:'none', txt:'até '+fmtShort(prazo)};
  }
  const sextas = saldo>0 && oldest ? fridaysSince(oldest.data) : 0;
  const late = prazo && saldo>0 ? Math.max(0, daysBetween(prazo, today())) : 0;
  return { items, saldo, total, abertas, oldest, prazo, status, sextas, late };
}

/* ---------- mascot: a coin that never comes back ---------- */
const MASCOT = `<svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
  <ellipse cx="62" cy="112" rx="34" ry="5" fill="rgba(27,36,0,.15)"/>
  <circle cx="60" cy="62" r="42" fill="#F5B82E"/><circle cx="60" cy="62" r="42" fill="none" stroke="#C98A10" stroke-width="5"/>
  <circle cx="60" cy="62" r="31" fill="none" stroke="#E3A11F" stroke-width="3" stroke-dasharray="4 5"/>
  <ellipse cx="47" cy="58" rx="6" ry="8" fill="#1B2400"/><ellipse cx="73" cy="58" rx="6" ry="8" fill="#1B2400"/>
  <circle cx="49" cy="55" r="2.2" fill="#fff"/><circle cx="75" cy="55" r="2.2" fill="#fff"/>
  <path d="M50 78 q10 -7 20 0" fill="none" stroke="#1B2400" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M96 30 q6 10 0 14 q-6 -4 0 -14z" fill="#7CC7F2"/>
  <ellipse cx="38" cy="72" rx="6" ry="3.5" fill="#F08A5D" opacity=".55"/><ellipse cx="82" cy="72" rx="6" ry="3.5" fill="#F08A5D" opacity=".55"/>
</svg>`;
/* a bill (boleto) that keeps coming back */
const MASCOT_PAY = `<svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
  <ellipse cx="60" cy="112" rx="32" ry="5" fill="rgba(0,0,0,.15)"/>
  <path d="M28 18h64v86l-8-6-8 6-8-6-8 6-8-6-8 6-8-6-8 6z" fill="#FFFFFF" stroke="#2A1A12" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M38 32h44M38 41h30" stroke="#2A1A12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M38 84h4M45 84h2M50 84h5M58 84h2M63 84h6M72 84h3M78 84h4" stroke="#2A1A12" stroke-width="7"/>
  <ellipse cx="49" cy="60" rx="5" ry="6.5" fill="#2A1A12"/><ellipse cx="71" cy="60" rx="5" ry="6.5" fill="#2A1A12"/>
  <circle cx="50.5" cy="58" r="1.8" fill="#fff"/><circle cx="72.5" cy="58" r="1.8" fill="#fff"/>
  <path d="M53 74 q7 -5 14 0" fill="none" stroke="#2A1A12" stroke-width="3" stroke-linecap="round"/>
  <path d="M98 22 q6 10 0 14 q-6 -4 0 -14z" fill="#7CC7F2"/>
</svg>`;
const LOGO = `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12M4 4v13M4 10.5h8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></svg>`;

/* ---------- look & texts (Ajustes) ---------- */
const DEF_TXT = { app:'Fiado', banner:'te devem', titulo:'quem *jurou* que pagava', botao:'Lançar fiado',
  bannerP:'você deve', tituloP:'pra quem você *prometeu* pagar', botaoP:'Lançar conta' };
// texts that change with the side: banner, titulo, botao
const T = k => PAGAR() ? txt(k+'P') : txt(k);
const DEF_BG = { light:'#F2F0FA', dark:'#0B0A0F' };
const PRESETS = [
  {n:'Limão', c:'#C9F03A'}, {n:'Chiclete', c:'#FF8FC7'}, {n:'Piscina', c:'#5CD3F5'},
  {n:'Tangerina', c:'#FF9A3D'}, {n:'Lavanda', c:'#B9A4FF'}, {n:'Menta', c:'#7FE3B0'}, {n:'Gema', c:'#FFD43B'},
];
const cfgNow = () => ui.preview || S.config;
const txt = k => { const v = ((cfgNow().textos||{})[k]||'').trim(); return v || DEF_TXT[k]; };
const fancy = s => esc(s).replace(/\*([^*]+)\*/g, '<em class="acc">$1</em>');
function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#16141F';
  const n = parseInt(m[1],16), ch = [n>>16, (n>>8)&255, n&255].map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
  const L = .2126*ch[0] + .7152*ch[1] + .0722*ch[2];
  return L > .38 ? '#16141F' : '#FFFFFF';
}
function isDark(c){
  const t = c.tema || 'auto';
  if(t!=='auto') return t==='dark';
  const host = document.documentElement.getAttribute('data-theme');
  if(host) return host==='dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyLook(c){
  const r = document.documentElement, st = r.style, cores = c.cores || {};
  const t = c.tema || 'auto';
  if(t==='auto') r.removeAttribute('data-mode'); else r.setAttribute('data-mode', t);
  const set = (k, v) => v ? st.setProperty(k, v) : st.removeProperty(k);
  set('--lime', cores.banner); set('--lime-ink', cores.banner && inkFor(cores.banner));
  set('--pay', cores.bannerPagar); set('--pay-ink', cores.bannerPagar && inkFor(cores.bannerPagar));
  set('--brand', cores.icone); set('--brand-ink', cores.icone && inkFor(cores.icone));
  set('--btn', cores.botao); set('--btn-ink', cores.botao && inkFor(cores.botao));
  const bg = isDark(c) ? cores.fundoEscuro : cores.fundoClaro;
  set('--bg', bg); set('--bg-glow', bg && `color-mix(in srgb, ${bg}, #7B5CFF 10%)`);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>applyLook(cfgNow()));
new MutationObserver(()=>applyLook(cfgNow())).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
function brandMark(){ const ic = (cfgNow().icone||'').trim(); return `<span class="brand-mark">${ic ? esc(ic) : LOGO}</span>`; }

/* ---------- render ---------- */
const lsGet = (k, d) => { try{ return localStorage.getItem(k) || d; }catch(e){ return d; } };
let ui = { sheet:null, update:false, tab:lsGet('fiado-tab','lista'), lado:lsGet('fiado-lado','receber'), aba:lsGet('fiado-aba','fiado') };
function trocarLado(l){ if(ui.lado===l) return; ui.lado = l; try{ localStorage.setItem('fiado-lado', l); }catch(e){} window.scrollTo(0,0); render(); }
function headerHTML(){ return `<header class="top">
    <div class="brand">${brandMark()}<span>${esc(txt('app'))}</span></div>
    <button class="icon-btn" id="btn-cfg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
  </header>`; }
const updHTML = () => ui.update ? `<div class="upd"><span>Tem versão nova do app. Seus dados continuam aqui.</span><button id="btn-upd">Atualizar app</button></div>` : '';
function ensureFab(){ let fab = $('#fab'); if(!fab){ fab = document.createElement('button'); fab.id='fab'; fab.className='fab'; document.body.appendChild(fab); } return fab; }
function themeColor(){ const tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#F2F0FA'; }
function render(){
  if(ui.aba!=='fiado' && MODS[ui.aba]){ renderOutra(); return; }
  const app = $('#app');
  const ppl = Object.entries(S.pessoas).map(([id,p])=>({id,...p, s:summary(id)}));
  const devendo = ppl.filter(p=>p.s.saldo>0).sort((a,b)=> b.s.late-a.s.late || b.s.saldo-a.s.saldo);

/* ---------- sheets ---------- */
function openSheet(s){ ui.sheet = s; render(); }
function closeSheet(){ ui.sheet = null; ui.preview = null; const l = $('#layer'); l.innerHTML=''; l.dataset.key=''; render(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ui.sheet) closeSheet(); });

function renderSheet(){
  const s = ui.sheet, layer = $('#layer');
  // keep form state across re-renders caused by live data
  if(layer.dataset.key === sheetKey(s) && s.type!=='pessoa') return;
  const focusId = document.activeElement && document.activeElement.id;
  let html = '';
  if(s.type==='novo') html = novoHTML(s);
  else if(s.type==='pessoa'){ if(!S.pessoas[s.pid]){ ui.sheet=null; layer.innerHTML=''; layer.dataset.key=''; return; } html = pessoaHTML(s); }
  else if(s.type==='pagar') html = pagarHTML(s);
  else if(s.type==='cobrar') html = cobrarHTML(s);
  else if(s.type==='cfg') html = cfgHTML();
  else if(s.type==='importar') html = importarHTML(s);
  else if(s.type==='resumo') html = resumoHTML();
  else if(SHEETS[s.type]) html = SHEETS[s.type].html(s);
  if(!html){ ui.sheet=null; layer.innerHTML=''; layer.dataset.key=''; render(); return; }
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${'<div class="grab"></div>'+html}</div></div>`;
  layer.dataset.key = sheetKey(s);
  $('#scrim').onclick = e=>{ if(e.target.id==='scrim') closeSheet(); };
  layer.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  wire(s);
  if(focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}
const sheetKey = s => s.type+':'+(s.pid||s.id||'');
// redraw the open sheet after its data changed (sheets keep form state otherwise)
function rerenderSheet(){ $('#layer').dataset.key=''; render(); }

function head(title){ return `<div class="sheet-h"><h3>${title}</h3><button class="x" data-close aria-label="Fechar">×</button></div>`; }

    return {id, ...p, saldo:sm.saldo, ult};
  }).sort((a,b)=> (b.saldo>0)-(a.saldo>0) || b.ult.localeCompare(a.ult) || a.nome.localeCompare(b.nome));
}

/* ---------- wiring ---------- */
function wire(s){
  if(s.type==='novo'){
    const prom = $('#n-prom');
    document.querySelectorAll('[data-prom]').forEach(b=>b.onclick=()=>{ prom.value=b.dataset.prom; document.querySelectorAll('[data-prom]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
    prom.oninput = ()=>document.querySelectorAll('[data-prom]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.prom===prom.value));
    const nomeInp = $('#n-nome'), box = $('#n-pchips'), tokens = $('#n-tokens'), split = $('#n-split'), valorInp = $('#n-valor');
    s.sel = s.sel || [];
    s.split = s.split || 'cada';
    // names picked so far (+ whatever is still typed) — one entry each
    const nomesFinais = () => { const t = nomeInp.value.trim(); const l = s.sel.slice(); if(t && !l.some(n=>norm(n)===norm(t))) l.push(t); return l; };
    const preview = () => {
      const n = s.pid ? 1 : nomesFinais().length, v = toCents(valorInp.value), h = $('#n-split-prev');
      split.hidden = n < 2;
      if(h){ if(n>1 && v>0){ h.hidden = false; h.textContent = s.split==='dividir' ? `${n} pessoas · ${brl(Math.floor(v/n))} pra cada` : `${n} lançamentos de ${brl(v)} (total ${brl(v*n)})`; } else h.hidden = true; }
    };
    const refresh = () => {
      if(tokens) tokens.innerHTML = s.sel.map((n,i)=>`<button type="button" class="tok" data-tok="${i}" aria-label="Tirar ${esc(n)}">${esc(n)}<b aria-hidden="true">×</b></button>`).join('');
      if(tokens) tokens.querySelectorAll('[data-tok]').forEach(b=>b.onclick=()=>{ s.sel.splice(+b.dataset.tok,1); refresh(); });
      if(box){ box.innerHTML = pchipsHTML(nomeInp.value, s.sel); box.querySelectorAll('[data-nome],[data-novo]').forEach(b=>b.onclick=()=>{ toggle(b.dataset.nome || b.dataset.novo); }); }
      nomeInp.placeholder = s.sel.length ? 'Mais alguém? Escreva e dê Enter' : 'Escreva um nome e dê Enter, ou toque abaixo';
      preview();
    };
    const toggle = nome => {
      const i = s.sel.findIndex(n=>norm(n)===norm(nome));
      if(i>=0) s.sel.splice(i,1); else s.sel.push(nome.trim());
      nomeInp.value = ''; $('#n-err').textContent = ''; refresh();
    };
    if(!s.pid){
      refresh();
      nomeInp.oninput = ()=>{ if(box){ box.innerHTML = pchipsHTML(nomeInp.value, s.sel); box.scrollLeft = 0; box.querySelectorAll('[data-nome],[data-novo]').forEach(b=>b.onclick=()=>toggle(b.dataset.nome || b.dataset.novo)); } preview(); };
      nomeInp.onkeydown = e=>{
        if(e.key!=='Enter') return;
        e.preventDefault();
        const t = nomeInp.value.trim();
        if(t){ const ex = Object.values(S.pessoas).find(p=>norm(p.nome)===norm(t)); if(!s.sel.some(n=>norm(n)===norm(t))) toggle(ex ? ex.nome : t); else { nomeInp.value=''; refresh(); } }
        else if(s.sel.length) valorInp.focus();
      };
      split.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{ s.split = b.dataset.split; split.querySelectorAll('[data-split]').forEach(x=>x.setAttribute('aria-pressed', x===b)); preview(); });
      valorInp.addEventListener('input', preview);
    }
    if(s.pid) setTimeout(()=>valorInp?.focus(),50);
    else if(!box) setTimeout(()=>nomeInp?.focus(),50);
    $('#f-novo').onsubmit = async e=>{
      e.preventDefault();
      const nomes = s.pid ? [S.pessoas[s.pid].nome] : nomesFinais(), valor = toCents(valorInp.value), data = $('#n-data').value || today();
      const err = $('#n-err');
      if(!nomes.length) return err.textContent = PAGAR() ? 'Escreve pra quem você deve.' : 'Escreve o nome de quem tá devendo.';
      if(!(valor>0)) return err.textContent='Coloca um valor maior que zero, tipo 45,90.';
      const n = nomes.length, dividir = n>1 && s.split==='dividir';
      const base = dividir ? Math.floor(valor/n) : valor, resto = dividir ? valor - base*n : 0;
      let ultimo = null;
      for(let i=0;i<n;i++){
        const nome = nomes[i];
        let pid = s.pid || Object.entries(S.pessoas).find(([,p])=>norm(p.nome)===norm(nome))?.[0];
        if(!pid){ pid = 'p-'+uid(); await put('pessoas', pid, {nome, telefone:'', criadoEm:Date.now()}); }
        await put('lanc', 'l-'+uid(), {pessoaId:pid, tipo:'divida', dir:ui.lado, valor:base+(i<resto?1:0), desc:$('#n-desc').value.trim(), data, prometido:prom.value||null, criadoEm:Date.now()+i});
        ultimo = pid;
      }
      if(n===1){ toast(`Anotado: ${nomes[0]} · ${brl(valor)}`); ui.sheet = {type:'pessoa', pid:ultimo}; $('#layer').dataset.key=''; render(); }
      else { toast(`Anotado pra ${n} pessoas` + (dividir ? ` · ${brl(base)} cada` : ` · ${brl(valor)} cada`)); closeSheet(); }
    };
  }
  if(s.type==='pessoa'){
    const b = id => document.getElementById(id);
    if(b('a-cobrar')) b('a-cobrar').onclick=()=>{ $('#layer').dataset.key=''; openSheet({type:'cobrar', pid:s.pid}); };
    if(b('a-pagar')) b('a-pagar').onclick=()=>{ $('#layer').dataset.key=''; openSheet({type:'pagar', pid:s.pid}); };
    if(b('a-mais')) b('a-mais').onclick=()=>{ $('#layer').dataset.key=''; openSheet({type:'novo', pid:s.pid}); };
    document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{
      if(x.classList.contains('armed')) del('lanc', x.dataset.del);
      else { x.classList.add('armed'); x.textContent='confirmar'; setTimeout(()=>{ if(x.isConnected){ x.classList.remove('armed'); x.textContent='apagar'; } }, 3000); }
    });
    if(b('p-outro')) b('p-outro').onclick = ()=>{ ui.lado = PAGAR() ? 'receber' : 'pagar'; try{ localStorage.setItem('fiado-lado', ui.lado); }catch(e){} $('#layer').dataset.key=''; render(); };
    const tel = b('p-tel');
    if(tel) tel.onchange = ()=>{ const p = S.pessoas[s.pid]; if((p.telefone||'')!==tel.value.trim()) put('pessoas', s.pid, {...p, telefone:tel.value.trim()}); };
    if(b('p-del')) b('p-del').onclick = async ()=>{
      if(!s.armed){ s.armed = true; renderSheet(); setTimeout(()=>{ if(ui.sheet===s && s.armed){ s.armed=false; renderSheet(); } }, 4000); return; }
      const nome = S.pessoas[s.pid].nome;
      const ids = Object.entries(S.lanc).filter(([,l])=>l.pessoaId===s.pid).map(([id])=>id);
      closeSheet();
      for(const id of ids) await del('lanc', id);
      await del('pessoas', s.pid);
      toast(nome+' saiu da lista');
    };
  }
  if(s.type==='pagar'){
    const v = $('#g-valor');
    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ v.value = brlShort(+b.dataset.v); document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
    $('#f-pagar').onsubmit = async e=>{
      e.preventDefault();
      const valor = toCents(v.value);
      if(!(valor>0)) return $('#g-err').textContent='Coloca quanto caiu, tipo 80 ou 45,50.';
      await put('lanc', 'l-'+uid(), {pessoaId:s.pid, tipo:'pagamento', dir:ui.lado, valor, desc:'', data:$('#g-data').value||today(), criadoEm:Date.now()});
      toast(PAGAR() ? 'pago − '+brl(valor) : 'pix recebido + '+brl(valor));
      $('#layer').dataset.key=''; openSheet({type:'pessoa', pid:s.pid});
    };
  }
  if(s.type==='cobrar'){
    document.querySelectorAll('[data-tom]').forEach(b=>b.onclick=()=>{ s.tom=b.dataset.tom; $('#layer').dataset.key=''; renderSheet(); });
    const msg = $('#c-msg'), wa = $('#c-wa');
    const tel = (S.pessoas[s.pid].telefone||'').replace(/\D/g,'');
    msg.oninput = ()=>{ wa.href = 'https://wa.me/'+(tel?(tel.length<=11?'55':'')+tel:'')+'?text='+encodeURIComponent(msg.value); };
    $('#c-copy').onclick = ()=>{
      const t = msg.value;
      navigator.clipboard.writeText(t).then(()=>toast('Mensagem copiada')).catch(()=>{ msg.focus(); msg.select(); toast('Selecionei o texto, é só copiar'); });
    };
  }
  if(SHEETS[s.type]) SHEETS[s.type].wire(s);
  if(s.type==='resumo'){
    document.querySelectorAll('#layer [data-open]').forEach(b=>b.onclick=()=>{ $('#layer').dataset.key=''; openSheet({type:'pessoa', pid:b.dataset.open}); });
  }
  if(s.type==='importar'){
    $('#imp-ok').onclick = ()=>{
      const d = s.dados;
      KINDS.forEach(k=>S[k] = d[k] || {}); S.config = d.config || {};
      saveLocal(); toast('Backup restaurado'); closeSheet();
    };
  }
  if(s.type==='cfg'){
    const form = $('#f-cfg');
    let tema = S.config.tema || 'auto';
    const read = () => {
      const cores = {}; form.querySelectorAll('[data-cor]').forEach(i=>{ if(i.dataset.set) cores[i.dataset.cor] = i.value.toUpperCase(); });
      const textos = {}; form.querySelectorAll('[data-txt]').forEach(i=>{ if(i.value.trim()) textos[i.dataset.txt] = i.value.trim(); });
      return { ...S.config, tema, cores, textos, icone:$('#cfg-icone').value.trim(), pix:$('#cfg-pix').value.trim(), assinatura:$('#cfg-ass').value.trim() };
    };
    const preview = () => { ui.preview = read(); render(); };
    const syncSwatches = () => { const b = (form.querySelector('[data-cor="banner"]').value||'').toUpperCase(); form.querySelectorAll('[data-preset]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.preset===b)); };
    form.querySelectorAll('[data-tema]').forEach(b=>b.onclick=()=>{ tema = b.dataset.tema; form.querySelectorAll('[data-tema]').forEach(x=>x.setAttribute('aria-pressed', x===b)); preview(); });
    form.querySelectorAll('[data-cor]').forEach(i=>i.oninput=()=>{ i.dataset.set='1'; syncSwatches(); preview(); });
    form.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ const i = form.querySelector(`[data-cor="${b.dataset.reset}"]`); i.value = COLOR_FIELDS.find(f=>f.k===b.dataset.reset).def; delete i.dataset.set; syncSwatches(); preview(); });
    form.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ ['banner','icone'].forEach(k=>{ const i = form.querySelector(`[data-cor="${k}"]`); i.value = b.dataset.preset; i.dataset.set='1'; }); syncSwatches(); preview(); });
    form.querySelectorAll('[data-txt], #cfg-icone').forEach(i=>i.oninput=preview);
    $('#cfg-reset-all').onclick = ()=>{
      tema = 'auto'; form.querySelectorAll('[data-tema]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.tema==='auto'));
      form.querySelectorAll('[data-cor]').forEach(i=>{ i.value = COLOR_FIELDS.find(f=>f.k===i.dataset.cor).def; delete i.dataset.set; });
      form.querySelectorAll('[data-txt]').forEach(i=>i.value=''); $('#cfg-icone').value='';
      syncSwatches(); preview(); toast('Visual original. Toque em Salvar pra manter.');
    };
    $('#bk-export').onclick = exportar;
    $('#cfg-upd').onclick = procurarUpdate;
    $('#bk-file').onchange = async e=>{
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if(!f) return;
      try{ const d = validarBackup(JSON.parse(await f.text())); ui.preview = null; $('#layer').dataset.key=''; openSheet({type:'importar', dados:d, nome:f.name}); }
      catch(err){ toast('Esse arquivo não é um backup do Fiado.', true); }
    };
    form.onsubmit = async e=>{ e.preventDefault(); const c = read(); ui.preview = null; await put('config', 'geral', c); toast('Ajustes salvos'); closeSheet(); };
  }
}

async function clearExamples(){
  const pids = Object.entries(S.pessoas).filter(([,p])=>p.exemplo).map(([id])=>id);
  const lids = Object.entries(S.lanc).filter(([,l])=>pids.includes(l.pessoaId)).map(([id])=>id);
  for(const id of lids) await del('lanc', id);
  for(const id of pids) await del('pessoas', id);
  toast('Exemplos apagados');
}

let tT;
function toast(msg, bad){
  let t = $('#toast'); if(!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.className = 'toast'+(bad?' bad':''); t.textContent = msg; t.hidden=false;
  clearTimeout(tT); tT = setTimeout(()=>t.hidden=true, 2600);
}

// a delete button that needs a second tap
function armDelete(sel, aviso, fn){
  const b = typeof sel==='string' ? $(sel) : sel; if(!b) return;
  const orig = b.textContent;
  b.onclick = ()=>{
    if(b.dataset.armed){ fn(); return; }
    b.dataset.armed = '1'; b.textContent = aviso; b.classList.add('armed');
    setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent = orig; b.classList.remove('armed'); } }, 4000);
  };
}
const swatchesHTML = (cores, atual) => `<div class="swatches">${cores.map(x=>`<button type="button" class="sw" data-cor="${x}" aria-pressed="${x===atual}" aria-label="Cor ${x}"><i style="background:${x}"></i></button>`).join('')}</div>`;

/* ---------- validação de backup das seções novas ---------- */
const okCor = v => /^#[0-9a-f]{6}$/i.test(v||'') ? v : null;
const okD = v => /^\d{4}-\d{2}-\d{2}$/.test(v||'') ? v : null;
const int = v => Number.isFinite(+v) ? Math.round(+v) : 0;
const str = (v, n=80) => String(v ?? '').slice(0, n);
const dia = v => Math.min(31, Math.max(1, int(v) || 1));
const SANE = {
  contas: x=>({nome:str(x.nome,30), saldo:int(x.saldo), cor:okCor(x.cor), atualizadoEm:okD(x.atualizadoEm)}),
  cartoes: x=>({nome:str(x.nome,30), limite:Math.max(0,int(x.limite)), fecha:dia(x.fecha), vence:dia(x.vence), cor:okCor(x.cor)}),
  compras: x=>({cartaoId:str(x.cartaoId,80), desc:str(x.desc,60), valor:Math.max(0,int(x.valor)), parcelas:Math.min(48,Math.max(1,int(x.parcelas))), data:okD(x.data)||today(), criadoEm:int(x.criadoEm)}),
  faturasPagas: x=>({pagoEm:okD(x.pagoEm), valor:int(x.valor)}),
  shopee: x=>({tipo:x.tipo==='recebido'?'recebido':'previsto', valor:Math.max(0,int(x.valor)), data:okD(x.data)||today(), desc:str(x.desc,60), criadoEm:int(x.criadoEm)}),
  perfumes: x=>({nome:str(x.nome,50), marca:str(x.marca,40), ml:Math.max(0,int(x.ml)), custo:Math.max(0,int(x.custo)), preco:Math.max(0,int(x.preco)), qtd:Math.max(0,int(x.qtd))}),
  vendas: x=>({perfumeId:str(x.perfumeId,80), nome:str(x.nome,50), cliente:str(x.cliente,60), qtd:Math.max(1,int(x.qtd)), valor:Math.max(0,int(x.valor)), custo:Math.max(0,int(x.custo)), data:okD(x.data)||today(), pago:!!x.pago, lancId:x.lancId?str(x.lancId,80):null, criadoEm:int(x.criadoEm)}),

const CORES_CC = ['#5B3FD1','#0F62FE','#1F7A5A','#C2410C','#B4235A','#8A1C1C','#2D2A38','#8A6A00'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const keyOf = (y, m) => { const d = new Date(y, m, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const addKey = (k, n) => { const [y,m] = k.split('-').map(Number); return keyOf(y, m-1+n); };
const keyNome = k => { const [y,m] = k.split('-').map(Number); return MESES[m-1] + (y!==new Date().getFullYear() ? '/'+String(y).slice(2) : ''); };
const diaEm = (k, d) => { const [y,m] = k.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return y+'-'+pad(m)+'-'+pad(Math.min(d, last)); };
// a fatura is named by the month it closes; buying on/after the closing day goes to the next one
function faturaDe(c, dataISO){ const d = parse(dataISO); return keyOf(d.getFullYear(), d.getMonth() + (d.getDate() >= c.fecha ? 1 : 0)); }
const fechaEm = (c, k) => diaEm(k, c.fecha);
const venceEm = (c, k) => c.vence > c.fecha ? diaEm(k, c.vence) : diaEm(addKey(k,1), c.vence);
function parcelasDe(cp, id){
  const c = S.cartoes[cp.cartaoId]; if(!c) return [];
  const n = Math.max(1, cp.parcelas|0), base = Math.floor(cp.valor/n), resto = cp.valor - base*n, k0 = faturaDe(c, cp.data);
  return Array.from({length:n}, (_,i)=>({key:addKey(k0,i), valor:base+(i===0?resto:0), i:i+1, n, desc:cp.desc, compraId:id}));
}
function cartaoInfo(id){
  const c = S.cartoes[id];
  const fat = {};
  for(const [cid,cp] of Object.entries(S.compras)) if(cp.cartaoId===id) for(const p of parcelasDe(cp, cid)) (fat[p.key] = fat[p.key] || []).push(p);
  const atual = faturaDe(c, today());
  const paga = k => !!S.faturasPagas[id+'_'+k];
  const total = k => (fat[k]||[]).reduce((s,p)=>s+p.valor,0);
  const status = k => {
    if(paga(k)) return {t:'paga', cls:'ok'};
    const t = today();
    if(t > venceEm(c,k)) return {t:'atrasada', cls:'late'};
    if(t >= fechaEm(c,k)) return {t:'fechada', cls:'soon'};
    return {t:'aberta', cls:'none'};
  };
  const keys = Object.keys(fat); if(!keys.includes(atual)) keys.push(atual); keys.sort();
  const usado = keys.filter(k=>!paga(k)).reduce((s,k)=>s+total(k),0);
  const pendentes = keys.filter(k=>k<atual && !paga(k) && total(k)>0);
  const aPagar = pendentes.reduce((s,k)=>s+total(k),0) + (paga(atual) ? 0 : total(atual));
  return {c, fat, atual, keys, paga, total, status, usado, pendentes, aPagar, livre:(c.limite||0)-usado};
}
const cartoesAPagar = () => Object.keys(S.cartoes).reduce((s,id)=>s+cartaoInfo(id).aPagar,0);

function shopeeResumo(){
  const its = Object.entries(S.shopee).map(([id,x])=>({id,...x}));
  const prev = its.filter(x=>x.tipo==='previsto').sort((a,b)=>a.data.localeCompare(b.data) || (a.criadoEm||0)-(b.criadoEm||0));
  let rec = its.filter(x=>x.tipo==='recebido').reduce((s,x)=>s+x.valor,0);
  const recebido = rec, abertas = [];
  // money received pays off the oldest releases first
  for(const p of prev){ const u = Math.min(rec, p.valor); rec -= u; if(p.valor-u>0) abertas.push({...p, resta:p.valor-u}); }
  return {its, abertas, aReceber:abertas.reduce((s,x)=>s+x.resta,0), recebido, sobra:rec};
}

/* ---------- backup ---------- */
const META = 'fiado-meta';
const getMeta = () => { try{ return JSON.parse(localStorage.getItem(META)||'{}'); }catch(e){ return {}; } };
const setMeta = m => { try{ localStorage.setItem(META, JSON.stringify({...getMeta(), ...m})); }catch(e){} };
function precisaBackup(){
  if(Object.keys(S.lanc).length < 3 || Object.values(S.pessoas).every(p=>p.exemplo)) return false;
  const u = getMeta().ultimoBackup; return !u || Date.now() - u > 30*864e5;
}
function backupTexto(){
  const u = getMeta().ultimoBackup;
  if(!u) return 'Você ainda não salvou nenhum backup. Se apagar o app ou trocar de celular sem backup, os fiados somem.';
  const d = new Date(u); return `Último backup: ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}.`;
}
async function exportar(){
  const dados = {app:'fiado', versao:2, exportadoEm:new Date().toISOString(), config:S.config};
  KINDS.forEach(k=>dados[k]=S[k]);
  const corpo = JSON.stringify(dados, null, 2);
  const nome = `fiado-backup-${today()}.json`;
  const file = new File([corpo], nome, {type:'application/json'});
  const toque = matchMedia('(pointer:coarse)').matches;
  if(toque && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Backup do Fiado'}); setMeta({ultimoBackup:Date.now()}); toast('Backup salvo'); render(); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  setMeta({ultimoBackup:Date.now()}); toast('Backup baixado'); render();
}
function validarBackup(j){
  if(!j || j.app!=='fiado' || typeof j.pessoas!=='object' || typeof j.lanc!=='object') throw new Error('formato');
  const pessoas = {}, lanc = {};
  for(const [id,p] of Object.entries(j.pessoas)){ if(p && typeof p.nome==='string') pessoas[id] = {nome:p.nome.slice(0,80), telefone:String(p.telefone||'').slice(0,30), exemplo:!!p.exemplo, criadoEm:+p.criadoEm||0}; }
  for(const [id,l] of Object.entries(j.lanc)){
    if(!l || !pessoas[l.pessoaId] || !['divida','pagamento'].includes(l.tipo) || !(Number.isInteger(l.valor) && l.valor>0) || !/^\d{4}-\d{2}-\d{2}$/.test(l.data||'')) continue;
    lanc[id] = {pessoaId:l.pessoaId, tipo:l.tipo, dir:l.dir==='pagar'?'pagar':'receber', valor:l.valor, desc:String(l.desc||'').slice(0,80), data:l.data, prometido:/^\d{4}-\d{2}-\d{2}$/.test(l.prometido||'')?l.prometido:null, criadoEm:+l.criadoEm||0};
  }
  const config = j.config && typeof j.config==='object' ? j.config : {};
  const out = {pessoas, lanc, config, exportadoEm:j.exportadoEm};
  // newer sections: rebuild each record from known fields only
  for(const k of Object.keys(SANE)){
    out[k] = {};
    if(j[k] && typeof j[k]==='object') for(const [id,x] of Object.entries(j[k])) if(x && typeof x==='object') out[k][String(id).slice(0,80)] = SANE[k](x);
  }
  return out;
}

/* ---------- resumo: a receber por dia e por pessoa ---------- */
function abertasTodas(){
  const out = [];
  for(const [pid,p] of Object.entries(S.pessoas)){
    const sm = summary(pid);
    for(const a of sm.abertas) out.push({...a, pid, nome:p.nome, pessoa:{id:pid,...p}});
  }
  return out;
}
function quandoTxt(d){
  const dd = daysBetween(today(), d);
  if(dd===0) return {t:'hoje', cls:'soon'};
  if(dd===1) return {t:'amanhã', cls:'soon'};
  if(dd<0) return {t: -dd===1 ? 'atrasado 1 dia' : `atrasado ${-dd} dias`, cls:'late'};
  if(dd<=6) return {t:`em ${dd} dias`, cls:'none'};
  return {t:`em ${dd} dias`, cls:'none'};
}
function resumoHTML(){
  const ab = abertasTodas(), t = today();
  const atrasado = ab.filter(a=>a.prometido && a.prometido<t).reduce((s,a)=>s+a.resta,0);
  const semana = ab.filter(a=>a.prometido && a.prometido>=t && daysBetween(t,a.prometido)<=6).reduce((s,a)=>s+a.resta,0);
  const semPrazo = ab.filter(a=>!a.prometido).reduce((s,a)=>s+a.resta,0);
  const dias = {};
  for(const a of ab){ const k = a.prometido || 'sem'; (dias[k] = dias[k] || []).push(a); }
  const chaves = Object.keys(dias).filter(k=>k!=='sem').sort();
  if(dias.sem) chaves.push('sem');
  const dayHTML = k => {
    const itens = dias[k].sort((a,b)=>b.resta-a.resta), tot = itens.reduce((s,a)=>s+a.resta,0);
    const pessoas = new Set(itens.map(a=>a.pid)).size;
    const q = k==='sem' ? {t:'sem data combinada', cls:'none'} : quandoTxt(k);
    return `<details class="day"><summary>
      <div style="min-width:0"><div class="d">${k==='sem' ? 'Sem prazo' : fmtDate(k)}</div><div class="s"><span class="pill ${q.cls}">${q.t}</span> · ${pessoas} ${pessoas===1?'pessoa':'pessoas'}</div></div>
      <div class="v num">${brl(tot)}</div><span class="chev" aria-hidden="true">›</span></summary>
      ${itens.map(a=>`<button class="who" data-open="${esc(a.pid)}">${avatar(a.pessoa)}<div style="min-width:0"><div class="n">${esc(a.nome)}</div><div class="s">${esc(a.desc||'fiado')} · desde ${fmtShort(a.data)}</div></div><div class="v num">${brl(a.resta)}</div></button>`).join('')}
    </details>`;
  };
  const ppl = Object.entries(S.pessoas).map(([id,p])=>({id,...p,s:summary(id)})).filter(p=>p.s.saldo>0).sort((a,b)=>b.s.saldo-a.s.saldo);
  const personHTML = p => `<details class="day"><summary>
      <div style="display:flex;gap:10px;align-items:center;min-width:0">${avatar(p)}<div style="min-width:0"><div class="d">${esc(p.nome)}</div><div class="s">${p.s.abertas.length} ${p.s.abertas.length===1?'lançamento aberto':'lançamentos abertos'}</div></div></div>
      <div class="v num">${brl(p.s.saldo)}</div><span class="chev" aria-hidden="true">›</span></summary>
      ${p.s.abertas.map(a=>`<div class="who" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0"><div class="n">${esc(a.desc||'fiado')}</div><div class="s">${fmtDate(a.data)}${a.prometido?' · jurou pra '+fmtShort(a.prometido):' · sem prazo'}</div></div><div class="v num">${brl(a.resta)}</div></div>`).join('')}
      <button class="open-p" data-open="${esc(p.id)}">Abrir ${esc(p.nome)} pra cobrar ou dar baixa ›</button>
    </details>`;
  const total = ab.reduce((s,a)=>s+a.resta,0);
  return `${head(esc(T('banner'))+' '+brl(total))}
  <div class="kpis">
    <div class="kpi late"><div class="k">Atrasado</div><div class="v num">${brl(atrasado)}</div></div>
    <div class="kpi"><div class="k">Próx. 7 dias</div><div class="v num">${brl(semana)}</div></div>
    <div class="kpi"><div class="k">Sem prazo</div><div class="v num">${brl(semPrazo)}</div></div>
  </div>
  <div class="sec-h"><h2 style="font-size:18px">${PAGAR() ? 'a pagar por dia' : 'a receber por dia'}</h2><span class="count">toque no dia pra ver quem</span></div>
  <div class="box">${chaves.map(dayHTML).join('') || '<p class="tiny" style="padding:14px;margin:0">Nada em aberto.</p>'}</div>
  <div class="sec-h"><h2 style="font-size:18px">por pessoa</h2><span class="count">${ppl.length} ${ppl.length===1?'pessoa':'pessoas'}</span></div>
  <div class="box">${ppl.map(personHTML).join('')}</div>`;
}

/* ---------- gráfico de pizza ---------- */
const CHART_L = ['#2A78D6','#EB6834','#1BAF7A','#EDA100','#E87BA4','#008300','#6250D6'];
const CHART_D = ['#3987E5','#D95926','#199E70','#C98500','#D55181','#2E9E2E','#9085E9'];
const OUTROS = '#8C8899';
function chartData(devendo, total){
  const pal = isDark(cfgNow()) ? CHART_D : CHART_L;
  const top = devendo.slice().sort((a,b)=>b.s.saldo-a.s.saldo);
  const fatias = top.slice(0,7).map((p,i)=>({id:p.id, nome:p.nome, v:p.s.saldo, cor:pal[i]}));
  if(top.length>7){ const resto = top.slice(7); fatias.push({id:null, nome:`Outros (${resto.length})`, v:resto.reduce((s,p)=>s+p.s.saldo,0), cor:OUTROS}); }
  return fatias.map(f=>({...f, pct: total ? f.v/total : 0}));
}
function arcPath(cx, cy, r0, r1, a0, a1){
  const p = (r,a)=>[cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const big = a1-a0 > Math.PI ? 1 : 0;
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`;
}
let chartCache = null;
function chartHTML(devendo, total){
  const fatias = chartData(devendo, total); chartCache = {fatias, total};
  let a = -Math.PI/2, paths = '';
  if(fatias.length===1) paths = `<circle cx="100" cy="100" r="76" fill="none" stroke="${fatias[0].cor}" stroke-width="40" data-i="0"/>`;
  else fatias.forEach((f,i)=>{ const a1 = a + f.pct*2*Math.PI; paths += `<path d="${arcPath(100,100,56,96,a,a1)}" fill="${f.cor}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round" data-i="${i}"><title>${esc(f.nome)}: ${brl(f.v)}</title></path>`; a = a1; });
  return `<section class="chart-card" aria-label="Quanto cada pessoa deve">
    <div class="sec-h"><h2 style="font-size:20px">${PAGAR() ? 'pra quem você <em class="acc">deve</em>' : 'quem deve <em class="acc">quanto</em>'}</h2><span class="count">toque numa fatia</span></div>
    <div class="donut-wrap" id="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Gráfico de pizza com o valor que cada pessoa deve">${paths}</svg>
      <div class="donut-c"><div class="k" id="dc-k">total</div><div class="v num" id="dc-v">${brl(total)}</div><div class="p" id="dc-p">${devendo.length} ${devendo.length===1?'pessoa':'pessoas'}</div></div></div>
    <div class="legend">${fatias.map((f,i)=>`<button class="lg" data-i="${i}" aria-pressed="false"><i style="background:${f.cor}"></i><span class="n">${esc(f.nome)}</span><span class="v num">${brl(f.v)}</span><span class="p num">${Math.round(f.pct*100)}%</span></button>`).join('')}</div>
    <p class="tiny" style="margin:0;text-align:center">Toque de novo na mesma pessoa pra abrir a ficha dela.</p>
  </section>`;
}
function wireChart(){
  const w = $('#donut'); if(!w || !chartCache) return;
  let sel = null;
  const pick = i => {
    const f = chartCache.fatias[i];
    if(sel===i && f.id){ openSheet({type:'pessoa', pid:f.id}); return; }
    sel = (sel===i) ? null : i;
    w.classList.toggle('has-sel', sel!==null);
    w.querySelectorAll('[data-i]').forEach(el=>el.classList.toggle('sel', +el.dataset.i===sel));
    document.querySelectorAll('.lg').forEach(el=>el.setAttribute('aria-pressed', +el.dataset.i===sel));
    const g = sel===null ? null : chartCache.fatias[sel];
    $('#dc-k').textContent = g ? g.nome : 'total';
    $('#dc-v').textContent = brl(g ? g.v : chartCache.total);
    $('#dc-p').textContent = g ? Math.round(g.pct*100)+'% do total' : chartCache.fatias.length+' na lista';
  };
  w.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  document.querySelectorAll('.lg').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
}

/* ---------- offline + atualização ---------- */
const APP_VERSION = '5';
let swReg = null, recarregando = false;
function mostrarUpdate(){ if(!ui.update){ ui.update = true; render(); } }
function aplicarUpdate(){
  const w = swReg && swReg.waiting;
  if(w){ w.postMessage('SKIP_WAITING'); toast('Atualizando…'); setTimeout(()=>location.reload(), 4000); }
  else location.reload();
}
async function procurarUpdate(){
  if(!swReg){ toast('Atualização só funciona no app instalado.', true); return; }
  toast('Procurando atualização…');
  try{ await swReg.update(); }catch(e){}
  setTimeout(()=>{ if(swReg.waiting || swReg.installing) mostrarUpdate(); else toast('Você já está na versão mais nova'); }, 1500);
}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(recarregando) return; recarregando = true; location.reload(); });
  addEventListener('load', async ()=>{
    try{
      swReg = await navigator.serviceWorker.register('sw.js');
      if(swReg.waiting && navigator.serviceWorker.controller) mostrarUpdate();
      swReg.addEventListener('updatefound', ()=>{
        const w = swReg.installing; if(!w) return;
        w.addEventListener('statechange', ()=>{ if(w.state==='installed' && navigator.serviceWorker.controller) mostrarUpdate(); });
      });
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') swReg.update().catch(()=>{}); });
    }catch(e){}
  });
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

boot();
